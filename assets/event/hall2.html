<body class="hall">

<div class="site-background hall"></div>

<div class="hall2-container">

  <!-- 🔙 돌아가기 -->
  <button class="back-btn" onclick="history.back()">← 돌아가기</button>

  <!-- 🎨 헤더 -->
  <div class="hall2-header">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
    <p class="hall2-guide">이미지를 클릭하면 전시로 이동합니다</p>
  </div>

  <!-- 📝 작가노트 -->
  <div class="hall2-note" id="hall2-note"></div>

  <!-- 💬 방명록 -->
  <div class="guestbook-section">

    <h2>방명록</h2>

    <form id="guestbook-form">
      <input type="hidden" name="exhibition_id" />
      <input type="text" name="message" placeholder="감상을 남겨주세요" required />
      <button type="submit">등록</button>
    </form>

    <div id="guestbook-list"></div>

  </div>

  <!-- 🖼 작품 리스트 -->
  <div id="hall2-list" class="hall2-list"></div>

</div>

<div id="pageFade"></div>

<script src="hall2.js"></script>

</body>
